<!DOCTYPE html>
<html>
<head>
    <title>Results</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <style>
        :root {
            --bg-1: #111827;
            --bg-2: #1F2937;
            --bg-3: #374151;
            --bg-4: #4B5563;
            --accent: #24A19C;
            --danger: #F75555;
            --success: #22C55E;
            --muted: #6B7280;
            --muted-2: #9CA3AF;
            --text: #FFFFFF;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            touch-action: none;
            overflow: hidden;
        }
        body {
            text-align: center;
            background: var(--bg-1);
            color: var(--text);
            font-family: Arial, sans-serif;
            padding: 6px;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            display: flex;
            flex-direction: column;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            position: fixed;
            top: 8px; left: 10px; right: 10px;
            width: auto;
            height: 42px;
            background: var(--bg-3);
            border: none;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            z-index: 1000;
        }
        .top-bar-left { display: flex; gap: 6px; }
        .top-bar-right { display: flex; gap: 8px; align-items: center; }
        .top-bar-title {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            color: var(--text);
            font-size: 14px;
            font-weight: bold;
            pointer-events: none;
            white-space: nowrap;
        }

        .top-bar-icon {
            width: 28px;
            height: 28px;
            cursor: pointer;
            background: none;
            border: 1px solid var(--bg-4);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            flex-shrink: 0;
        }
        .top-bar-icon:hover { background: var(--accent); border-color: var(--accent); }
        .top-bar-icon:hover svg { fill: var(--bg-1); }
        .top-bar-icon svg { width: 15px; height: 15px; fill: var(--text); transition: fill 0.3s; }
        .top-bar-icon.gear-icon:hover { transform: rotate(90deg); }
        .top-bar-icon.info-icon {
            font-weight: bold;
            font-size: 14px;
            color: var(--text);
            font-family: Georgia, serif;
            font-style: italic;
        }
        .top-bar-icon.info-icon:hover { color: var(--bg-1); }
        .top-bar-icon.info-icon.active { background: var(--accent); border-color: var(--accent); color: var(--bg-1); }

        /* ===== MOBILE REFERENCE OVERLAY ===== */
        .ref-overlay {
            display: none;
            position: fixed;
            top: 54px;
            right: 10px;
            left: auto;
            width: auto;
            max-width: 200px;
            max-height: 32vh;
            overflow-y: auto;
            background: transparent;
            z-index: 999;
            text-align: right;
            padding: 0;
        }
        .ref-overlay.active { display: block; }
        .ref-overlay img {
            max-width: 200px;
            width: 100%;
            border-radius: 8px;
            border: none;
            display: block;
        }
        .ref-overlay-empty {
            color: var(--muted-2);
            font-size: 11px;
            background: var(--bg-3);
            border: 1px solid var(--bg-4);
            border-radius: 6px;
            padding: 6px 10px;
        }

        /* ===== MODALS ===== */
        .pwd-overlay, .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            z-index: 3000;
            align-items: center;
            justify-content: center;
        }
        .pwd-overlay.active, .modal-overlay.active { display: flex; }
        .pwd-box, .modal-box {
            background: var(--bg-2);
            border: 1px solid var(--bg-4);
            border-radius: 12px;
            padding: 24px;
            width: 320px;
            text-align: center;
        }
        .pwd-title, .modal-title {
            color: var(--text);
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 16px;
        }
        .pwd-input, .modal-input {
            width: 100%;
            padding: 10px;
            font-size: 14px;
            border: 1px solid var(--bg-4);
            border-radius: 8px;
            background: var(--bg-1);
            color: var(--text);
            margin-bottom: 16px;
            text-align: center;
        }
        .pwd-error { color: var(--danger); font-size: 12px; margin-bottom: 15px; display: none; }
        .pwd-error.active { display: block; }
        .pwd-btns, .modal-btns { display: flex; gap: 10px; justify-content: center; }
        .pwd-btn, .modal-btn {
            padding: 8px 20px;
            font-size: 13px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid var(--bg-4);
            background: var(--bg-3);
            color: var(--text);
        }
        .pwd-btn.primary, .modal-btn.primary { background: var(--accent); color: var(--bg-1); }

        /* ===== MAIN FLEX LAYOUT ===== */
        .main-layout {
            display: flex;
            width: 100%;
            height: 100%;
            flex: 1;
            min-height: 0;
        }

        /* ===== CONTENT AREA ===== */
        .content-wrap {
            flex: 1;
            min-height: 0;
            padding: 56px 4px 4px 4px;
            overflow: hidden;
            box-sizing: border-box;
            height: 100%;
        }
        .grid-view {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 1px;
            background: var(--success);
            border: 1px solid var(--success);
            height: 100%;
            width: 100%;
            overflow: hidden;
            box-sizing: border-box;
        }
        .grid-view.hidden { display: none; }

        .full-image-view {
            display: none;
            height: 100%;
            width: 100%;
            background: #000;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid var(--bg-4);
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .full-image-view.active { display: flex; }
        .full-image-view img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
            transform-origin: center center;
        }

        .img-box {
            position: relative;
            background: #000;
            overflow: hidden;
            cursor: pointer;
        }
        .img-box img {
            width: 100%; height: 100%;
            object-fit: contain;
            display: block;
            transform-origin: center center;
        }

        .img-label {
            position: absolute;
            top: 4px; left: 4px;
            background: rgba(0,0,0,0.6);
            color: var(--accent);
            padding: 2px 8px;
            border-radius: 3px;
            font-size: 10px;
            font-weight: bold;
            z-index: 10;
            user-select: none;
        }

        /* ===== COMMON IMAGE SELECT BUTTONS ===== */
        .image-select-btns {
            display: flex;
            flex-shrink: 0;
            gap: 4px;
            padding: 4px;
            justify-content: center;
            width: 100%;
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.15s;
        }
        .image-select-btns.active {
            visibility: visible;
            opacity: 1;
            pointer-events: auto;
        }
        .btn {
            padding: 6px 4px;
            font-size: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            border: 1px solid var(--bg-4);
            background: var(--bg-3);
            color: var(--text);
            white-space: nowrap;
        }
        .btn.active { background: var(--accent); color: var(--bg-1); border-color: var(--accent); }

        .desktop-panel { display: none; }

        /* ===== DESKTOP / LAPTOP STYLES ===== */
        @media (min-width: 769px) {
            .top-bar .info-icon { display: none !important; }

            .content-wrap {
                flex: 0 0 68%;
                max-width: 68%;
                padding: 54px 10px 10px 10px;
                max-height: 100dvh;
            }

            .desktop-panel {
                flex: 0 0 32%;
                max-width: 32%;
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: space-between;
                padding: 54px 15px 15px 10px;
                height: 100%;
                box-sizing: border-box;
            }

            .desktop-ref-container {
                width: 100%;
                max-width: 460px;
                background: transparent;
                border: none;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
            }
            .desktop-ref-container img {
                width: 100%;
                height: auto;
                max-height: 55vh;
                object-fit: contain;
                border: none;
            }

            .desktop-bottom-section {
                width: 100%;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }

            .desktop-panel .image-select-btns {
                height: auto;
                padding: 0;
                flex-wrap: nowrap !important;
                width: 100%;
                justify-content: center;
                gap: 3px;
            }
            .desktop-panel .image-select-btns .btn {
                padding: 6px 3px;
                font-size: 9px;
                flex: 1;
                min-width: 0;
                text-align: center;
            }

            .desktop-btn-row {
                display: flex;
                flex-direction: row;
                gap: 15px;
                justify-content: center;
                align-items: center;
                width: 100%;
            }

            .desktop-square-btn {
                width: 60px;
                height: 60px;
                background: var(--bg-3);
                border: 1px solid var(--bg-4);
                border-radius: 12px;
                color: var(--text);
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
                transition: all 0.3s;
                padding: 0;
            }
            .desktop-square-btn:hover, .desktop-square-btn.active {
                background: var(--accent);
                color: var(--bg-1);
                border-color: var(--accent);
            }
            .desktop-square-btn svg {
                width: 24px;
                height: 24px;
                fill: currentColor;
            }

            .home-bar { display: none; }
            .mobile-image-select { display: none !important; }
        }

        /* ===== MOBILE PORTRAIT STYLES ===== */
        @media (max-width: 768px) and (orientation: portrait) {
            .content-wrap { 
                padding: 52px 3px 56px 3px; 
                max-height: calc(100dvh - 50px);
            }
            .top-bar { top: 8px; height: 40px; padding: 0 6px; }
            .top-bar-icon { width: 26px; height: 26px; }
            .top-bar-icon svg { width: 14px; height: 14px; }

            .mobile-image-select {
                position: fixed;
                bottom: 52px;
                left: 10px;
                right: 10px;
                width: auto;
                z-index: 1001;
                background: transparent !important;
                border: none !important;
                border-radius: 0;
                padding: 0 !important;
                display: none;
                flex-direction: row;
                justify-content: space-between;
                gap: 2px !important;
            }
            .mobile-image-select.active {
                display: flex !important;
            }
            .mobile-image-select .btn {
                flex: 1;
                min-width: 0;
                padding: 8px 2px;
                font-size: 9px;
                text-align: center;
            }

            .home-bar {
                position: fixed;
                bottom: 8px;
                left: 10px;
                right: 10px;
                height: 40px;
                background: var(--bg-3);
                border-radius: 12px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
                z-index: 1000;
                box-shadow: 0 4px 15px rgba(0, 0, 0, 0.4);
            }

            .home-btn, .bottom-bar-icon {
                width: 26px;
                height: 26px;
                background: var(--bg-1);
                border: 1px solid var(--bg-4);
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                color: var(--text);
                cursor: pointer;
            }
            .home-btn svg, .bottom-bar-icon svg {
                width: 14px;
                height: 14px;
                fill: var(--text);
            }
        }

        /* ===== MOBILE LANDSCAPE ===== */
        @media (max-width: 768px) and (orientation: landscape) {
            .content-wrap { padding: 48px 3px 48px 3px; }
            .top-bar { top: 8px; height: 36px; }
            .mobile-image-select { bottom: 46px; left: 10px; right: 10px; gap: 2px; background: transparent !important; border: none !important; }
            .mobile-image-select .btn { flex: 1; min-width: 0; padding: 6px 1px; font-size: 8px; }
            .home-bar {
                position: fixed;
                bottom: 6px; left: 10px; right: 10px;
                height: 36px;
                background: var(--bg-3);
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 0 8px;
                z-index: 1000;
            }
            .home-btn, .bottom-bar-icon { width: 24px; height: 24px; }
            .home-btn svg, .bottom-bar-icon svg { width: 13px; height: 13px; }
        }
    </style>
</head>
<body>

    <!-- TOP BAR -->
    <div class="top-bar">
        <span class="top-bar-title">Result</span>
        <div class="top-bar-left"></div>
        <div class="top-bar-right">
            <div class="top-bar-icon info-icon" id="refInfoBtn" onclick="toggleReferenceImage()" title="Reference Image">i</div>
            <div class="top-bar-icon gear-icon" onclick="openPasswordModal()" title="Settings">
                <svg viewBox="0 0 24 24">
                    <path d="M12 15.5A3.5 3.5 0 0 1 8.5 12 3.5 3.5 0 0 1 12 8.5a3.5 3.5 0 0 1 3.5 3.5 3.5 3.5 0 0 1-3.5 3.5m7.43-2.53c.04-.32.07-.64.07-.97 0-.33-.03-.66-.07-1l2.11-1.63c.19-.15.24-.42.12-.64l-2-3.46c-.12-.22-.39-.3-.61-.22l-2.49 1c-.52-.4-1.08-.73-1.69-.98l-.38-2.65A.488.488 0 0 0 14 2h-4c-.25 0-.46.18-.5.42l-.38 2.65c-.61.25-1.17.59-1.69.98l-2.49-1c-.23-.09-.49 0-.61.22l-2 3.46c-.13.22-.07.49.12.64L4.57 11c-.04.34-.07.67-.07 1 0 .33.03.66.07 1l-2.11 1.63c-.19.15-.24.42-.12.64l2 3.46c.12.22.39.3.61.22l2.49-1.01c.52.4 1.08.73 1.69-.98l.38 2.65c.04.24.25.42.5.42h4c.25 0 .46-.18.5-.42l.38-2.65c.61-.25 1.17-.59 1.69-.98l2.49 1.01c.22.08.49 0 .61-.22l2-3.46c.12-.22.07-.49-.12-.64l-2.11-1.63Z"/>
                </svg>
            </div>
        </div>
    </div>

    <!-- MOBILE REFERENCE IMAGE OVERLAY -->
    <div class="ref-overlay" id="refOverlay">
        {% if ref_image %}
        <img src="{{ url_for('ref_image', filename=ref_image) }}" alt="Reference Image">
        {% else %}
        <div class="ref-overlay-empty">No reference image found</div>
        {% endif %}
    </div>

    <!-- PASSWORD MODAL -->
    <div class="pwd-overlay" id="pwdOverlay">
        <div class="pwd-box">
            <div class="pwd-title">Enter Password</div>
            <input type="password" class="pwd-input" id="pwdInput" placeholder="••••••" maxlength="6">
            <div class="pwd-error" id="pwdError">Incorrect password!</div>
            <div class="pwd-btns">
                <button class="pwd-btn" onclick="closePasswordModal()">Cancel</button>
                <button class="pwd-btn primary" onclick="checkPassword()">Ok</button>
            </div>
        </div>
    </div>

    <!-- DOWNLOAD MODAL -->
    <div class="modal-overlay" id="downloadModal">
        <div class="modal-box">
            <div class="modal-title">Enter ZIP Filename</div>
            <input type="text" class="modal-input" id="zipNameInput" placeholder="e.g. diamond_scan" value="">
            <div class="modal-btns">
                <button class="modal-btn" onclick="closeDownloadModal()">Cancel</button>
                <button class="modal-btn primary" onclick="confirmDownload()">Download</button>
            </div>
        </div>
    </div>

    <div id="appData" data-super="{% if super_exists %}true{% else %}false{% endif %}" style="display:none;"></div>

    <!-- MAIN CONTAINER -->
    <div class="main-layout">
        <!-- LEFT AREA (4-Grid / Full View) -->
        <div class="content-wrap">
            <div class="grid-view" id="gridView">
                <div class="img-box" id="box-result">
                    <span class="img-label" onclick="event.stopPropagation(); switchImage('result', 'whitelight.jpg', 'White Light')">Result</span>
                    <img id="img-result" src="{{ url_for('get_image', path=path, filename='result.jpg') }}" alt="Result">
                </div>
                <div class="img-box" id="box-fluor">
                    <span class="img-label">Flor</span>
                    <img id="img-fluor" src="{{ url_for('get_image', path=path, filename='fluorescence.jpg') }}" alt="Fluor">
                </div>
                <div class="img-box" id="box-short">
                    <span class="img-label" onclick="event.stopPropagation(); switchImage('short', 'superimage.jpg', 'Super Image')">Short</span>
                    <img id="img-short" src="{{ url_for('get_image', path=path, filename='shortphosphorescence.jpg') }}" alt="Short">
                </div>
                <div class="img-box" id="box-long">
                    <span class="img-label" onclick="event.stopPropagation(); switchImage('long', 'simulant.jpg', 'Simulant')">Long</span>
                    <img id="img-long" src="{{ url_for('get_image', path=path, filename='longphosphorescence.jpg') }}" alt="Long">
                </div>
            </div>
            <div class="full-image-view" id="fullImageView">
                <img id="fullImage" src="" alt="Full View">
            </div>
        </div>

        <!-- RIGHT PANEL (DESKTOP ONLY) -->
        <div class="desktop-panel">
            <div class="desktop-ref-container">
                {% if ref_image %}
                <img src="{{ url_for('ref_image', filename=ref_image) }}" alt="Reference Image">
                {% else %}
                <div class="ref-overlay-empty">No reference image found</div>
                {% endif %}
            </div>

            <div class="desktop-bottom-section">
                <div class="image-select-btns" id="desktopImageSelectBtns">
                    <button class="btn" onclick="showImage('result.jpg', 'Result', this)">Result</button>
                    <button class="btn" onclick="showImage('whitelight.jpg', 'WL', this)">WL</button>
                    <button class="btn" onclick="showImage('fluorescence.jpg', 'Flor', this)">Flor</button>
                    <button class="btn" onclick="showImage('shortphosphorescence.jpg', 'Short', this)">Short</button>
                    <button class="btn" onclick="showImage('longphosphorescence.jpg', 'Long', this)">Long</button>
                    <button class="btn" onclick="showImage('simulant.jpg', 'Simu', this)">Simu</button>
                    <button class="btn" id="btnSuperImgDesktop" style="display:none;" onclick="showImage('superimage.jpg', 'Super', this)">Super</button>
                </div>

                <div class="desktop-btn-row">
                    <button class="desktop-square-btn" id="desktopToggleBtn" onclick="toggleViewMode()" title="Toggle View">
                        <svg id="desktopIconGrid" viewBox="0 0 24 24"><path d="M3 3h8v8H3V3m10 0h8v8h-8V3M3 13h8v8H3v-8m10 0h8v8h-8v-8Z"/></svg>
                        <svg id="desktopIconFull" viewBox="0 0 24 24" style="display:none;"><path d="M4 4h6v2H6v4H4V4m10 0h6v6h-2V6h-4V4M4 14h2v4h4v2H4v-6m16 0v6h-6v-2h4v-4h2Z"/></svg>
                    </button>

                    <button class="desktop-square-btn" onclick="goHome()" title="Home">
                        <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    </button>

                    <button class="desktop-square-btn" onclick="openDownloadModal()" title="Download">
                        <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2m14-9h-4V3H9v8H5l7 7 7-7Z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- MOBILE FULL VIEW IMAGE SELECTOR BAR -->
    <div class="image-select-btns mobile-image-select" id="imageSelectBtns">
        <button class="btn" onclick="showImage('result.jpg', 'Result', this)">Result</button>
        <button class="btn" onclick="showImage('whitelight.jpg', 'WL', this)">WL</button>
        <button class="btn" onclick="showImage('fluorescence.jpg', 'Flor', this)">Flor</button>
        <button class="btn" onclick="showImage('shortphosphorescence.jpg', 'Short', this)">Short</button>
        <button class="btn" onclick="showImage('longphosphorescence.jpg', 'Long', this)">Long</button>
        <button class="btn" onclick="showImage('simulant.jpg', 'Simu', this)">Simu</button>
        <button class="btn" id="btnSuperImg" style="display:none;" onclick="showImage('superimage.jpg', 'Super', this)">Super</button>
    </div>

    <!-- MOBILE BOTTOM BAR -->
    <div class="home-bar">
        <button class="bottom-bar-icon" id="viewToggleBtnBottom" onclick="toggleViewMode()" title="Toggle View">
            <svg id="viewToggleIconGrid" viewBox="0 0 24 24"><path d="M3 3h8v8H3V3m10 0h8v8h-8V3M3 13h8v8H3v-8m10 0h8v8h-8v-8Z"/></svg>
            <svg id="viewToggleIconFull" viewBox="0 0 24 24" style="display:none;"><path d="M4 4h6v2H6v4H4V4m10 0h6v6h-2V6h-4V4M4 14h2v4h4v2H4v-6m16 0v6h-6v-2h4v-4h2Z"/></svg>
        </button>

        <button class="home-btn" onclick="goHome()" title="Home">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
        </button>

        <button class="bottom-bar-icon" onclick="openDownloadModal()" title="Download">
            <svg viewBox="0 0 24 24"><path d="M5 20h14v-2H5v2m14-9h-4V3H9v8H5l7 7 7-7Z"/></svg>
        </button>
    </div>

    <script>
        const path = "{{ path }}";
        const superExists = document.getElementById('appData').dataset.super === 'true';
        const CORRECT_PASSWORD = "654321";
        let resultMode = 'result', shortMode = 'short', longMode = 'long';
        let isFullView = false;

        /* Zoom & Pan Variables */
        let zoomLevel = 1, panX = 0, panY = 0;
        let fullZoomLevel = 1, fullPanX = 0, fullPanY = 0;

        /* ===== MODALS & ROUTING ===== */
        function openPasswordModal() {
            document.getElementById('pwdOverlay').classList.add('active');
            document.getElementById('pwdInput').value = '';
            document.getElementById('pwdError').classList.remove('active');
            setTimeout(() => document.getElementById('pwdInput').focus(), 100);
        }
        function closePasswordModal() { document.getElementById('pwdOverlay').classList.remove('active'); }
        function checkPassword() {
            if (document.getElementById('pwdInput').value === CORRECT_PASSWORD) {
                closePasswordModal();
                window.location.href = '/settings';
            } else {
                document.getElementById('pwdError').classList.add('active');
            }
        }
        function openDownloadModal() { document.getElementById('downloadModal').classList.add('active'); }
        function closeDownloadModal() { document.getElementById('downloadModal').classList.remove('active'); }
        function confirmDownload() {
            let name = document.getElementById('zipNameInput').value.trim() || 'diamond_scan';
            name = name.replace(/[^a-zA-Z0-9_-]/g, '');
            closeDownloadModal();
            window.location.href = `/download/${path}?name=${encodeURIComponent(name)}`;
        }
        function toggleReferenceImage() {
            document.getElementById('refOverlay').classList.toggle('active');
            document.getElementById('refInfoBtn').classList.toggle('active');
        }
        function goHome() { window.location.href = '/'; }

        /* ===== VIEW TOGGLE ===== */
        function toggleViewMode() {
            if (isFullView) showGridView();
            else showFullView();
        }
        function updateViewToggleUI() {
            const iconGrid = document.getElementById('viewToggleIconGrid');
            const iconFull = document.getElementById('viewToggleIconFull');
            const deskGrid = document.getElementById('desktopIconGrid');
            const deskFull = document.getElementById('desktopIconFull');
            const deskBtn = document.getElementById('desktopToggleBtn');
            const mobileBtn = document.getElementById('viewToggleBtnBottom');

            if (isFullView) {
                if(iconGrid) iconGrid.style.display = 'none';
                if(iconFull) iconFull.style.display = '';
                if(deskGrid) deskGrid.style.display = 'none';
                if(deskFull) deskFull.style.display = '';
                if(deskBtn) deskBtn.classList.add('active');
                if(mobileBtn) mobileBtn.classList.add('active');
            } else {
                if(iconGrid) iconGrid.style.display = '';
                if(iconFull) iconFull.style.display = 'none';
                if(deskGrid) deskGrid.style.display = '';
                if(deskFull) deskFull.style.display = 'none';
                if(deskBtn) deskBtn.classList.remove('active');
                if(mobileBtn) mobileBtn.classList.remove('active');
            }
        }

        function showGridView() {
            isFullView = false;
            document.getElementById('gridView').classList.remove('hidden');
            document.getElementById('fullImageView').classList.remove('active');
            document.getElementById('imageSelectBtns').classList.remove('active');
            document.getElementById('desktopImageSelectBtns').classList.remove('active');
            updateViewToggleUI();
            fullZoomLevel = 1; fullPanX = 0; fullPanY = 0; applyFullZoom();
            resetAll();
        }

        function showFullView() {
            isFullView = true;
            document.getElementById('gridView').classList.add('hidden');
            document.getElementById('fullImageView').classList.add('active');
            document.getElementById('imageSelectBtns').classList.add('active');
            document.getElementById('desktopImageSelectBtns').classList.add('active');
            updateViewToggleUI();

            const btnSuper = document.getElementById('btnSuperImg');
            const btnSuperDesk = document.getElementById('btnSuperImgDesktop');
            if(btnSuper) btnSuper.style.display = superExists ? 'inline-flex' : 'none';
            if(btnSuperDesk) btnSuperDesk.style.display = superExists ? 'inline-flex' : 'none';

            /* FIX: Mobile aur Desktop dono containers ke first (Result) button ko select karein */
            const firstBtnMobile = document.querySelector('#imageSelectBtns .btn');
            const firstBtnDesktop = document.querySelector('#desktopImageSelectBtns .btn');
            
            showImage('result.jpg', 'Result', window.innerWidth <= 768 ? firstBtnMobile : firstBtnDesktop);
        }

        function showImage(filename, label, btn) {
            document.getElementById('fullImage').src = `/image/${path}/${filename}`;
            fullZoomLevel = 1; fullPanX = 0; fullPanY = 0; applyFullZoom();
            
            /* Saare buttons se active class hata kar active clicked button par lagayein */
            document.querySelectorAll('.image-select-btns .btn').forEach(b => b.classList.remove('active'));
            if (btn) btn.classList.add('active');
            
            /* Mobile & Desktop sync */
            const allBtnList = Array.from(document.querySelectorAll('.image-select-btns .btn'));
            allBtnList.forEach(b => {
                if(b.textContent.trim().toLowerCase() === label.trim().toLowerCase()) {
                    b.classList.add('active');
                }
            });
        }

        function switchImage(box, filename, label) {
            if (box === 'fluor') return;
            const img = document.getElementById('img-' + box);
            const lbl = document.querySelector('#box-' + box + ' .img-label');
            if (box === 'result') {
                if (resultMode === 'result') { img.src = `/image/${path}/${filename}`; lbl.textContent = label; resultMode = 'whitelight'; }
                else { img.src = `/image/${path}/result.jpg`; lbl.textContent = 'Result'; resultMode = 'result'; }
            } else if (box === 'short') {
                if (shortMode === 'short' && superExists) { img.src = `/image/${path}/${filename}`; lbl.textContent = label; shortMode = 'super'; }
                else { img.src = `/image/${path}/shortphosphorescence.jpg`; lbl.textContent = 'Short'; shortMode = 'short'; }
            } else if (box === 'long') {
                if (longMode === 'long') { img.src = `/image/${path}/${filename}`; lbl.textContent = label; longMode = 'simulant'; }
                else { img.src = `/image/${path}/longphosphorescence.jpg`; lbl.textContent = 'Long'; longMode = 'long'; }
            }
        }

        function resetAll() {
            resultMode = 'result'; shortMode = 'short'; longMode = 'long';
            document.getElementById('img-result').src = `/image/${path}/result.jpg`;
            document.querySelector('#box-result .img-label').textContent = 'Result';
            document.getElementById('img-short').src = `/image/${path}/shortphosphorescence.jpg`;
            document.querySelector('#box-short .img-label').textContent = 'Short';
            document.getElementById('img-long').src = `/image/${path}/longphosphorescence.jpg`;
            document.querySelector('#box-long .img-label').textContent = 'Long';
            zoomLevel = 1; panX = 0; panY = 0; applyZoomToAll();
        }

        /* ===== ZOOM & PAN LOGIC (4-GRID SYNC & FULL VIEW) ===== */
        function applyZoomToAll() {
            document.querySelectorAll('.img-box img').forEach(img => {
                img.style.transform = `scale(${zoomLevel}) translate(${panX / zoomLevel}px, ${panY / zoomLevel}px)`;
            });
        }
        function clampPan() {
            const box = document.querySelector('.img-box');
            if (!box) return;
            const maxPanX = (box.offsetWidth * (zoomLevel - 1)) / 2;
            const maxPanY = (box.offsetHeight * (zoomLevel - 1)) / 2;
            panX = Math.max(-maxPanX, Math.min(maxPanX, panX));
            panY = Math.max(-maxPanY, Math.min(maxPanY, panY));
        }

        const gridView = document.getElementById('gridView');
        gridView.addEventListener('wheel', function(e) {
            e.preventDefault();
            zoomLevel = Math.min(5, Math.max(1, zoomLevel + (e.deltaY > 0 ? -0.15 : 0.15)));
            clampPan(); applyZoomToAll();
        }, { passive: false });

        let gMouse = { dragging: false, startX: 0, startY: 0 };
        gridView.addEventListener('mousedown', function(e) {
            if (e.button === 0) { e.preventDefault(); gMouse.dragging = true; gMouse.startX = e.clientX - panX; gMouse.startY = e.clientY - panY; gridView.style.cursor = 'grabbing'; }
        });
        document.addEventListener('mousemove', function(e) {
            if (gMouse.dragging) { panX = e.clientX - gMouse.startX; panY = e.clientY - gMouse.startY; clampPan(); applyZoomToAll(); }
        });
        document.addEventListener('mouseup', function(e) { if (e.button === 0) { gMouse.dragging = false; gridView.style.cursor = ''; } });

        let gTouch = { active: false, pinching: false, startDist: 0, startZoom: 1, startX: 0, startY: 0, lastTap: 0 };
        gridView.addEventListener('touchstart', function(e) {
            if (e.touches.length === 2) {
                gTouch.pinching = true; gTouch.active = false;
                gTouch.startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                gTouch.startZoom = zoomLevel;
            } else if (e.touches.length === 1) {
                gTouch.pinching = false; gTouch.active = true;
                gTouch.startX = e.touches[0].clientX - panX; gTouch.startY = e.touches[0].clientY - panY;
                const now = Date.now();
                if (now - gTouch.lastTap < 300) { zoomLevel = 1; panX = 0; panY = 0; applyZoomToAll(); }
                gTouch.lastTap = now;
            }
        }, { passive: true });
        gridView.addEventListener('touchmove', function(e) {
            if (e.touches.length === 2 && gTouch.pinching) {
                e.preventDefault();
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                zoomLevel = Math.min(5, Math.max(1, gTouch.startZoom * (dist / gTouch.startDist)));
                clampPan(); applyZoomToAll();
            } else if (e.touches.length === 1 && gTouch.active) {
                e.preventDefault();
                panX = e.touches[0].clientX - gTouch.startX; panY = e.touches[0].clientY - gTouch.startY;
                clampPan(); applyZoomToAll();
            }
        }, { passive: false });
        gridView.addEventListener('touchend', function(e) { if (e.touches.length < 2) gTouch.pinching = false; if (e.touches.length === 0) gTouch.active = false; }, { passive: true });

        /* Full View Zoom & Pan */
        function applyFullZoom() {
            const img = document.getElementById('fullImage');
            if (img) img.style.transform = `scale(${fullZoomLevel}) translate(${fullPanX / fullZoomLevel}px, ${fullPanY / fullZoomLevel}px)`;
        }
        function clampFullPan() {
            const container = document.getElementById('fullImageView');
            if (!container) return;
            const maxPanX = (container.offsetWidth * (fullZoomLevel - 1)) / 2;
            const maxPanY = (container.offsetHeight * (fullZoomLevel - 1)) / 2;
            fullPanX = Math.max(-maxPanX, Math.min(maxPanX, fullPanX));
            fullPanY = Math.max(-maxPanY, Math.min(maxPanY, fullPanY));
        }

        const fullImageView = document.getElementById('fullImageView');
        fullImageView.addEventListener('wheel', function(e) {
            if (!isFullView) return;
            e.preventDefault();
            fullZoomLevel = Math.min(5, Math.max(1, fullZoomLevel + (e.deltaY > 0 ? -0.15 : 0.15)));
            clampFullPan(); applyFullZoom();
        }, { passive: false });

        let fMouse = { dragging: false, startX: 0, startY: 0 };
        fullImageView.addEventListener('mousedown', function(e) {
            if (!isFullView || e.button !== 0) return;
            e.preventDefault(); fMouse.dragging = true; fMouse.startX = e.clientX - fullPanX; fMouse.startY = e.clientY - fullPanY; fullImageView.style.cursor = 'grabbing';
        });
        document.addEventListener('mousemove', function(e) {
            if (fMouse.dragging) { fullPanX = e.clientX - fMouse.startX; fullPanY = e.clientY - fMouse.startY; clampFullPan(); applyFullZoom(); }
        });
        document.addEventListener('mouseup', function(e) { if (e.button === 0) { fMouse.dragging = false; fullImageView.style.cursor = ''; } });

        let fTouch = { active: false, pinching: false, startDist: 0, startZoom: 1, startX: 0, startY: 0, lastTap: 0 };
        fullImageView.addEventListener('touchstart', function(e) {
            if (!isFullView) return;
            if (e.touches.length === 2) {
                fTouch.pinching = true; fTouch.active = false;
                fTouch.startDist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                fTouch.startZoom = fullZoomLevel;
            } else if (e.touches.length === 1) {
                fTouch.pinching = false; fTouch.active = true;
                fTouch.startX = e.touches[0].clientX - fullPanX; fTouch.startY = e.touches[0].clientY - fullPanY;
                const now = Date.now();
                if (now - fTouch.lastTap < 300) { fullZoomLevel = 1; fullPanX = 0; fullPanY = 0; applyFullZoom(); }
                fTouch.lastTap = now;
            }
        }, { passive: true });
        fullImageView.addEventListener('touchmove', function(e) {
            if (!isFullView) return;
            if (e.touches.length === 2 && fTouch.pinching) {
                e.preventDefault();
                const dist = Math.hypot(e.touches[0].pageX - e.touches[1].pageX, e.touches[0].pageY - e.touches[1].pageY);
                fullZoomLevel = Math.min(5, Math.max(1, fTouch.startZoom * (dist / fTouch.startDist)));
                clampFullPan(); applyFullZoom();
            } else if (e.touches.length === 1 && fTouch.active) {
                e.preventDefault();
                fullPanX = e.touches[0].clientX - fTouch.startX; fullPanY = e.touches[0].clientY - fTouch.startY;
                clampFullPan(); applyFullZoom();
            }
        }, { passive: false });
        fullImageView.addEventListener('touchend', function(e) { if (e.touches.length < 2) fTouch.pinching = false; if (e.touches.length === 0) fTouch.active = false; }, { passive: true });
    </script>
